name: Temporary Anthropic connection diagnostic

on:
  workflow_dispatch:
    inputs:
      start_at:
        description: UTC epoch seconds for the paired probe start
        required: true
        type: string
      seconds:
        description: Probe duration in seconds
        default: 180
        type: number

permissions:
  contents: read

concurrency:
  group: anthropic-network-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  network:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Compare fresh IPv4 connections without API credentials
        env:
          PROBE_START_AT: ${{ inputs.start_at }}
          PROBE_SECONDS: ${{ inputs.seconds }}
          PROBE_VANTAGE: github-ubuntu
        run: python3 tools/probe-anthropic-network.py
