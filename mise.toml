[env]
_.file = ".env"

[tools]
node = "26.10.0"
ruby = "4.0.7"
"github:aubepkg/aube" = "2.6.1"
"npm:typescript" = "7.0.2"
"aqua:fish-shell/fish-shell" = "4.9.3"
hk = "2.4.0"
gitleaks = "8.30.1"
uv = "0.12.21"
jactionlint = "2.2.0"

[tasks.setup]
description = "Install development dependencies"
run = "bash tools/setup-development.sh"

[tasks."lint:javascript"]
description = "Check JavaScript and TypeScript with anti-slop rules"
sources = ["extensions/**", "test/**", ".oxlintrc.json", "tools/oxlint/**", "package.json", "development/package.json", "development/aube-lock.yaml"]
run = "node_modules/.bin/oxlint --config .oxlintrc.json --deny-warnings ."

[tasks."lint:format"]
description = "Check JavaScript and TypeScript formatting"
sources = ["**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}", ".oxfmtrc.json", "mise.toml", "development/package.json", "development/aube-lock.yaml"]
run = "node_modules/.bin/oxfmt --check '**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'"

[tasks."lint:skills"]
description = "Validate bundled skills"
sources = ["skills/**", "tools/lint_agent_skills.rb"]
run = "ruby tools/lint_agent_skills.rb"

[tasks."lint:secrets"]
description = "Scan the working tree for secrets"
run = "gitleaks dir --redact=75 --no-banner --no-color --max-target-megabytes 5 ."

[tasks."lint:actions"]
description = "Check GitHub Actions workflows"
sources = [".github/workflows/*.yml"]
run = "jactionlint --strict-exit"

[tasks.lint]
description = "Run all lint checks"
depends = ["lint:javascript", "lint:format", "lint:skills", "lint:secrets", "lint:actions"]

[tasks."test:javascript"]
description = "Run JavaScript extension tests"
sources = ["extensions/**", "test/**", "package.json", "development/package.json", "development/aube-lock.yaml"]
run = "node --test test/*_test.mjs"

[tasks."test:ruby"]
description = "Run existing Pi system and skill tests"
sources = ["extensions/**", "skills/**", "test/**"]
run = "ruby -Itest -e 'Dir.glob(\"test/**/*_test.rb\").sort.each { |file| require_relative file }'"

[tasks."test:types"]
description = "Type-check every extension"
sources = ["extensions/**", "test/support/**", "tsconfig.json", "package.json", "development/package.json", "development/aube-lock.yaml"]
run = "tsc --project tsconfig.json"

[tasks.test]
description = "Run the full existing test suite and type checks"
depends = ["test:javascript", "test:ruby", "test:types"]

[tasks."format:javascript"]
description = "Format JavaScript and TypeScript"
run = "node_modules/.bin/oxfmt '**/*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'"
